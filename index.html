<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Baby Bash</title>
<meta name="description" content="A full-screen toy for babies: every key or tap sets off a colour burst and a gentle synth note.">
<meta name="theme-color" content="#0b0a1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  /* Layout: one full-bleed night-sky canvas; a single start card sits on it until the first touch. */
  :root {
    --sky: #0b0a1f;        /* deep indigo night, trails fade into this */
    --ink: #fff7ea;        /* warm white for type */
    --soft: #b9b3e6;       /* lavender for secondary copy */
    --glow: #ffd35c;       /* sunny yellow accent */
    --card: rgba(255, 255, 255, 0.06);
    --font-display: "Baloo 2", "Comic Neue", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--sky);
    color: var(--ink);
    font-family: var(--font-display);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    cursor: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #start {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding-inline: 16px;
    cursor: pointer;
    z-index: 2;
  }
  #start .card {
    display: grid; gap: 0.6rem; justify-items: center; text-align: center;
    padding: 2.2rem 2.4rem;
    border-radius: 2rem;
    background: var(--card);
    max-width: 30rem;
  }
  #start h1 {
    margin: 0;
    font-size: clamp(3rem, 12vw, 6rem);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.01em;
    text-wrap: balance;
    background: linear-gradient(90deg, #ff6fa8, var(--glow), #5fe3c0, #6fb6ff, #c08bff);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  #start .go {
    font-size: clamp(1.2rem, 4vw, 1.6rem);
    font-weight: 600;
    color: var(--ink);
    animation: bob 1.6s ease-in-out infinite;
  }
  #start .note {
    font-size: 0.95rem; font-weight: 600; color: var(--soft);
    line-height: 1.4; max-width: 24rem; text-wrap: balance;
  }
  #start:focus-visible .card { outline: 3px solid var(--glow); outline-offset: 6px; }
  #start .links { display: flex; gap: 0.5rem; margin-top: 0.4rem; }
  #start .links a {
    display: grid; place-items: center;
    width: 44px; height: 44px; border-radius: 50%;
    color: var(--soft);
    transition: color 0.2s ease, background-color 0.2s ease;
  }
  #start .links a:hover, #start .links a:focus-visible { color: var(--ink); background: var(--card); }
  #start .links a:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  #start .links svg { width: 24px; height: 24px; fill: currentColor; }

  #hint {
    position: fixed; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    font-size: 0.85rem; font-weight: 600; color: var(--soft);
    opacity: 0; transition: opacity 1s ease;
    z-index: 1; pointer-events: none;
  }
  #hint.show { opacity: 0.7; }

  /* Touch screens have no Esc key: a faint corner button that must be held to exit */
  #exit {
    display: none;
    position: fixed; z-index: 1;
    top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px));
    width: 52px; height: 52px; padding: 0; border: 0; border-radius: 50%;
    background: var(--card); color: var(--soft);
    opacity: 0.45; touch-action: none;
  }
  body.playing.touch #exit { display: grid; place-items: center; }
  #exit svg { width: 100%; height: 100%; }
  #exit .x { stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
  #exit .ring {
    fill: none; stroke: var(--glow); stroke-width: 3; stroke-linecap: round;
    stroke-dasharray: 145; stroke-dashoffset: 145;
    transform: rotate(-90deg); transform-origin: center;
  }
  #exit.holding { opacity: 0.9; }
  #exit.holding .ring { stroke-dashoffset: 0; transition: stroke-dashoffset var(--hold) linear; }

  @keyframes bob { 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { #start .go { animation: none; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="start" tabindex="0" role="button" aria-label="Start Baby Bash">
  <div class="card">
    <h1>Baby Bash</h1>
    <div class="go">Tap, click or press any key</div>
    <div class="note">Goes full screen. Every key makes a colour burst and a note. Grown-ups: hold Esc, or the ✕ in the corner on a touch screen, for a moment to get out.</div>
    <div class="links">
      <a href="https://github.com/russellmorton/baby-bash" target="_blank" rel="noopener" aria-label="Baby Bash on GitHub" title="GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <a href="https://x.com/russell_morton" target="_blank" rel="noopener" aria-label="@russell_morton on X" title="@russell_morton on X">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
      </a>
    </div>
  </div>
</div>
<div id="hint">Hold Esc to exit</div>
<button id="exit" type="button" aria-label="Hold to exit" tabindex="-1">
  <svg viewBox="0 0 52 52" aria-hidden="true">
    <circle class="ring" cx="26" cy="26" r="23"/>
    <path class="x" d="M20 20l12 12M32 20L20 32"/>
  </svg>
</button>

<script>
(() => {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const startEl = document.getElementById('start');
  const hintEl = document.getElementById('hint');
  const exitEl = document.getElementById('exit');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0b0a1f'; ctx.fillRect(0, 0, W, H);
  }
  addEventListener('resize', resize);
  resize();

  /* ---------- Sound ---------- */
  // C major pentatonic across ~3 octaves: no wrong notes, however it's mashed.
  const PENTA = [0, 2, 4, 7, 9];
  const NOTES = [];
  for (let oct = 0; oct < 3; oct++) for (const s of PENTA) NOTES.push(48 + oct * 12 + s); // C3..A5
  const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);

  let ac = null, master = null, voices = 0;
  const MAX_VOICES = 14;

  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    // Gentle on little ears: low master level, then a limiter so stacked notes never get loud.
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 12;
    comp.attack.value = 0.003; comp.release.value = 0.25;
    master = ac.createGain();
    master.gain.value = 0.32;
    // Soft echo for a dreamy tail
    const delay = ac.createDelay(1); delay.delayTime.value = 0.28;
    const fb = ac.createGain(); fb.gain.value = 0.28;
    const wet = ac.createGain(); wet.gain.value = 0.22;
    const tone = ac.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 2400;
    master.connect(comp);
    master.connect(delay); delay.connect(tone); tone.connect(fb); fb.connect(delay); tone.connect(wet); wet.connect(comp);
    comp.connect(ac.destination);
  }

  function env(g, t, peak, attack, decay) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  }
  function track(node, end) {
    voices++;
    node.onended = () => { voices--; };
    node.stop(end);
  }

  const SYNTHS = [
    // Pluck: bright triangle with a quick fade
    (f, t, vel) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      env(g, t, 0.5 * vel, 0.005, 0.7);
      o.connect(g).connect(master); o.start(t); track(o, t + 0.8);
    },
    // Bell: sine FM, glassy and soft
    (f, t, vel) => {
      const car = ac.createOscillator(), mod = ac.createOscillator();
      const mg = ac.createGain(), g = ac.createGain();
      car.type = 'sine'; car.frequency.value = f * 2;
      mod.type = 'sine'; mod.frequency.value = f * 2 * 3.5;
      mg.gain.setValueAtTime(f * 2.5, t); mg.gain.exponentialRampToValueAtTime(1, t + 1.2);
      mod.connect(mg).connect(car.frequency);
      env(g, t, 0.28 * vel, 0.004, 1.4);
      car.connect(g).connect(master);
      car.start(t); mod.start(t); mod.stop(t + 1.5); track(car, t + 1.5);
    },
    // Bloop: sine that swoops down, like a bubble
    (f, t, vel) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f * 2, t);
      o.frequency.exponentialRampToValueAtTime(f, t + 0.12);
      env(g, t, 0.55 * vel, 0.006, 0.45);
      o.connect(g).connect(master); o.start(t); track(o, t + 0.55);
    },
    // Pad: two detuned saws through a closing filter
    (f, t, vel) => {
      const a = ac.createOscillator(), b = ac.createOscillator();
      const lp = ac.createBiquadFilter(), g = ac.createGain();
      a.type = b.type = 'sawtooth';
      a.frequency.value = f; b.frequency.value = f; a.detune.value = -9; b.detune.value = 9;
      lp.type = 'lowpass'; lp.Q.value = 4;
      lp.frequency.setValueAtTime(f * 8, t); lp.frequency.exponentialRampToValueAtTime(f * 1.5, t + 0.9);
      env(g, t, 0.16 * vel, 0.03, 1.1);
      a.connect(lp); b.connect(lp); lp.connect(g).connect(master);
      a.start(t); b.start(t); b.stop(t + 1.2); track(a, t + 1.2);
    },
    // Zap: square wave arpeggio up, very short
    (f, t, vel) => {
      const o = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'square'; lp.type = 'lowpass'; lp.frequency.value = 1800;
      [1, 1.25, 1.5, 2].forEach((r, i) => o.frequency.setValueAtTime(f * r, t + i * 0.05));
      env(g, t, 0.14 * vel, 0.004, 0.32);
      o.connect(lp).connect(g).connect(master); o.start(t); track(o, t + 0.4);
    },
  ];

  function playNote(noteIdx, synthIdx, vel = 1) {
    if (!ac || voices >= MAX_VOICES) return;
    const t = ac.currentTime + 0.005;
    SYNTHS[synthIdx % SYNTHS.length](midiHz(NOTES[noteIdx % NOTES.length]), t, vel);
  }
  function playChord(rootIdx, synthIdx) {
    [0, 2, 4].forEach((step, i) => {
      if (!ac) return;
      setTimeout(() => playNote(rootIdx + step, synthIdx, 0.7), i * 40);
    });
  }

  /* ---------- Visuals ---------- */
  const particles = [];
  const rings = [];
  const glyphs = [];
  const MAX_PARTICLES = reduced ? 600 : 1600;
  let bgHue = 250;

  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    // Final mix (murmur3 fmix32): without it, codes that differ only in the last
    // character ("KeyA", "KeyB", ...) land on just two hues
    h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b);
    h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35);
    h ^= h >>> 16;
    return h >>> 0;
  }
  const rand = (a, b) => a + Math.random() * (b - a);

  function burst(x, y, hue, big = false) {
    const count = (big ? 110 : 55) * (reduced ? 0.4 : 1);
    const shape = Math.floor(Math.random() * 3); // 0 dots, 1 stars, 2 mixed
    for (let i = 0; i < count && particles.length < MAX_PARTICLES; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = rand(1.5, big ? 11 : 7.5) * (reduced ? 0.5 : 1);
      particles.push({
        x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: rand(3, big ? 14 : 10),
        hue: (hue + rand(-35, 35) + 360) % 360,
        life: 1,
        decay: rand(0.008, 0.02),
        star: shape === 1 || (shape === 2 && Math.random() < 0.4),
        spin: rand(-0.15, 0.15), rot: Math.random() * 6.28,
      });
    }
    rings.push({ x, y, r: 10, max: big ? Math.max(W, H) * 0.6 : rand(120, 260), hue, life: 1 });
    if (big) rings.push({ x, y, r: 4, max: Math.max(W, H) * 0.4, hue: (hue + 120) % 360, life: 1 });
  }

  // Each colour/shape is drawn once to a small sprite, then stamped with drawImage.
  // Far cheaper than building a path and a colour string per particle per frame.
  const SPRITE = 64;
  const sprites = new Map();
  function sprite(hue, star) {
    const key = Math.round(hue / 10) * 2 + (star ? 1 : 0);
    let c = sprites.get(key);
    if (c) return c;
    c = document.createElement('canvas');
    c.width = c.height = SPRITE;
    const g = c.getContext('2d'), m = SPRITE / 2;
    g.fillStyle = `hsl(${Math.round(hue / 10) * 10}, 100%, 64%)`;
    g.beginPath();
    if (star) {
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 ? m * 0.45 : m - 1, a = -Math.PI / 2 + i * Math.PI / 5;
        g.lineTo(m + Math.cos(a) * rr, m + Math.sin(a) * rr);
      }
      g.closePath();
    } else g.arc(m, m, m - 1, 0, Math.PI * 2);
    g.fill();
    sprites.set(key, c);
    return c;
  }
  // Order doesn't matter, so remove by swapping with the last item instead of splice
  function drop(arr, i) { arr[i] = arr[arr.length - 1]; arr.pop(); }

  function frame() {
    bgHue = (bgHue + 0.03) % 360;
    // Translucent wash leaves soft trails behind everything
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `hsla(${bgHue}, 50%, 7%, ${reduced ? 0.5 : 0.16})`;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (let i = rings.length - 1; i >= 0; i--) {
      const g = rings[i];
      g.r += (g.max - g.r) * 0.07;
      g.life -= 0.022;
      if (g.life <= 0) { drop(rings, i); continue; }
      ctx.strokeStyle = `hsla(${g.hue}, 95%, 65%, ${g.life * 0.6})`;
      ctx.lineWidth = 6 * g.life + 1;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2); ctx.stroke();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.97; p.vy = p.vy * 0.97 + 0.06;
      p.rot += p.spin;
      p.life -= p.decay;
      if (p.life <= 0) { drop(particles, i); continue; }
      const r = p.r * (0.4 + 0.6 * p.life);
      ctx.globalAlpha = p.life;
      if (p.star) {
        const c = Math.cos(p.rot) * DPR, sn = Math.sin(p.rot) * DPR;
        ctx.setTransform(c, sn, -sn, c, p.x * DPR, p.y * DPR);
        ctx.drawImage(sprite(p.hue, true), -r, -r, r * 2, r * 2);
      } else {
        ctx.drawImage(sprite(p.hue, false), p.x - r, p.y - r, r * 2, r * 2);
      }
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation = 'source-over';
    for (let i = glyphs.length - 1; i >= 0; i--) {
      const g = glyphs[i];
      g.life -= 0.012;
      if (g.life <= 0) { glyphs.splice(i, 1); continue; }
      const s = g.size * (1.25 - 0.25 * g.life);
      ctx.font = `800 ${s}px "Baloo 2", "Trebuchet MS", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = `hsla(${g.hue}, 100%, 75%, ${g.life})`;
      ctx.fillText(g.ch, g.x, g.y);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- Input ---------- */
  let started = false;
  const lastHit = new Map();

  function hit(id, x, y, opts = {}) {
    // Throttle a held-down key so it pulses instead of firing 30 times a second
    const now = performance.now();
    if (now - (lastHit.get(id) || 0) < 110) return;
    lastHit.set(id, now);

    const h = hash(id);
    const hue = h % 360;
    const noteIdx = h % NOTES.length;
    const synthIdx = (h >>> 8) % SYNTHS.length;
    if (opts.big) { burst(x, y, hue, true); playChord(noteIdx % 8, synthIdx); }
    else { burst(x, y, hue); playNote(noteIdx, synthIdx); }
    if (opts.ch) glyphs.push({ ch: opts.ch, x, y, hue, life: 1, size: Math.min(W, H) * 0.32 });
  }

  async function begin() {
    initAudio();
    if (started) return;
    started = true;
    startEl.hidden = true;
    document.body.classList.add('playing');
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
      // In Chromium full screen this captures Ctrl+W, Alt+Tab and friends; Esc must then be held to exit.
      if (navigator.keyboard && navigator.keyboard.lock) await navigator.keyboard.lock();
    } catch (e) { /* fullscreen or keyboard lock not allowed here; carry on */ }
    try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
    hintEl.textContent = document.body.classList.contains('touch') ? 'Hold ✕ to exit' : 'Hold Esc to exit';
    hintEl.classList.add('show');
    setTimeout(() => hintEl.classList.remove('show'), 4000);
    hit('hello', W / 2, H / 2, { big: true });
  }

  function stop() {
    if (!started) return;
    started = false;
    startEl.hidden = false;
    document.body.classList.remove('playing');
    cancelHold();
    try { navigator.keyboard && navigator.keyboard.unlock(); } catch (e) {}
  }
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) stop(); });

  // Under keyboard lock Chromium only lets go after Esc is held for about two seconds,
  // so leave sooner ourselves. Releasing Esc early cancels.
  const ESC_HOLD_MS = 800;
  let escTimer = 0;
  function cancelEsc() { clearTimeout(escTimer); escTimer = 0; }
  function leave() {
    escTimer = 0; holdTimer = 0;
    if (document.fullscreenElement) document.exitFullscreen().catch(stop);
    else stop();
  }

  addEventListener('keydown', e => {
    if (!started) {
      // On the start card, Tab moves between the links and Enter follows one
      if (e.key === 'Tab' || (e.key === 'Enter' && e.target.closest && e.target.closest('a'))) return;
      e.preventDefault();
      // Esc, or a key still auto-repeating from before, must not restart the toy straight after leaving
      if (e.key !== 'Escape' && !e.repeat) begin();
      return;
    }
    e.preventDefault();
    if (e.key === 'Escape' && !escTimer) escTimer = setTimeout(leave, ESC_HOLD_MS);
    const key = e.key || e.code;
    const big = key === ' ' || key === 'Enter';
    const ch = key.length === 1 && key.trim() ? key.toUpperCase() : null;
    hit(e.code || key, rand(W * 0.1, W * 0.9), rand(H * 0.12, H * 0.88), { big, ch });
  }, { capture: true });
  addEventListener('keyup', e => {
    e.preventDefault();
    if (e.key === 'Escape') cancelEsc();
  }, { capture: true });
  addEventListener('blur', cancelEsc);

  // Phones have no Esc, and iPhones can't go full screen at all, so hold the corner ✕ instead
  const EXIT_HOLD_MS = 1500;
  exitEl.style.setProperty('--hold', EXIT_HOLD_MS + 'ms');
  let holdTimer = 0;
  function cancelHold() { clearTimeout(holdTimer); holdTimer = 0; exitEl.classList.remove('holding'); }
  exitEl.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation(); // no burst under the button
    if (holdTimer) return;
    exitEl.classList.add('holding');
    holdTimer = setTimeout(leave, EXIT_HOLD_MS);
  });
  for (const type of ['pointerup', 'pointercancel', 'pointerleave']) exitEl.addEventListener(type, cancelHold);

  addEventListener('pointerdown', e => {
    if (!started && e.target.closest('#start a')) return; // let link taps through
    e.preventDefault();
    if (e.pointerType && e.pointerType !== 'mouse') document.body.classList.add('touch');
    if (!started) { begin(); return; }
    hit('pointer' + Math.floor(Math.random() * 40), e.clientX, e.clientY);
  });
  addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('wheel', e => e.preventDefault(), { passive: false });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && started && navigator.wakeLock) {
      navigator.wakeLock.request('screen').catch(() => {});
    }
  });
})();
</script>
</body>
